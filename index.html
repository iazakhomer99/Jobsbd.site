<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: radial-gradient(
    circle at 50% 0%,
    #1b2650 0%,
    #0a0e27 55%,
    #05071a 100%
  );
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 70px;
  overflow-x: hidden;
  position: relative;
}

body::before,
body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  z-index: 0;
}

body::before {
  width: 280px;
  height: 280px;
  background: #00e5ff;
  opacity: 0.18;
  top: -60px;
  left: -60px;
}

body::after {
  width: 320px;
  height: 320px;
  background: #a259ff;
  opacity: 0.18;
  bottom: -80px;
  right: -60px;
}

.login-container {
  width: 100%;
  max-width: 380px;
  padding: 0 24px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.logo-wrap {
  perspective: 600px;
  margin-bottom: 36px;
}

.logo {
  width: 90px;
  height: 90px;
  margin: 0 auto;
  display: block;
  filter:
    drop-shadow(0 10px 20px rgba(0, 229, 255, 0.35))
    drop-shadow(0 0 25px rgba(162, 89, 255, 0.25));
  animation: floatTilt 4s ease-in-out infinite;
}

@keyframes floatTilt {
  0%, 100% {
    transform: rotateY(-8deg)
               rotateX(4deg)
               translateY(0px);
  }

  50% {
    transform: rotateY(8deg)
               rotateX(-4deg)
               translateY(-10px);
  }
}

.input-group {
  display: flex;
  align-items: center;
  background: linear-gradient(
    145deg,
    rgba(30, 38, 74, 0.75),
    rgba(15, 20, 45, 0.75)
  );
  backdrop-filter: blur(12px);
  border: 1px solid rgba(0, 229, 255, 0.18);
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 18px;
  gap: 14px;
  box-shadow:
    0 8px 20px rgba(0, 0, 0, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.input-group:focus-within {
  border-color: rgba(0, 229, 255, 0.6);
  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.4),
    0 0 0 3px rgba(0, 229, 255, 0.12);
}

.input-group .icon {
  color: #00e5ff;
  font-size: 20px;
  flex-shrink: 0;
  width: 22px;
  text-align: center;
}

.input-group input {
  background: transparent;
  border: none;
  outline: none;
  color: #eaf0ff;
  font-size: 17px;
  width: 100%;
}

.input-group input::placeholder {
  color: #6b76a8;
}

.captcha-row {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.captcha-box {
  flex: 1;
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background:
    linear-gradient(
      145deg,
      rgba(30, 38, 74, 0.85),
      rgba(15, 20, 45, 0.85)
    );
  border: 1px solid rgba(0, 229, 255, 0.18);
  color: #00e5ff;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 6px;
  user-select: none;
}

.captcha-refresh {
  width: 58px;
  min-height: 58px;
  border: 1px solid rgba(162, 89, 255, 0.35);
  border-radius: 14px;
  background: linear-gradient(
    135deg,
    #2a3466,
    #1a2250
  );
  color: #c9d4ff;
  font-size: 24px;
  cursor: pointer;
}

.btn {
  display: block;
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 18px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 16px;
}

.btn-login {
  background: linear-gradient(
    135deg,
    #00e5ff 0%,
    #0077ff 100%
  );
  color: #04101f;
  box-shadow:
    0 10px 25px rgba(0, 150, 255, 0.35),
    0 0 20px rgba(0, 229, 255, 0.25);
}

.btn-register {
  background: linear-gradient(
    135deg,
    #2a3466 0%,
    #1a2250 100%
  );
  color: #c9d4ff;
  border: 1px solid rgba(162, 89, 255, 0.35);
}

.error-msg {
  color: #ff5c7a;
  font-size: 14px;
  margin-bottom: 14px;
  display: none;
  text-shadow: 0 0 10px rgba(255, 92, 122, 0.5);
}
</style>
</head>

<body>

<div class="login-container">

  <div class="logo-wrap">

    <svg class="logo"
         viewBox="0 0 100 100"
         xmlns="http://www.w3.org/2000/svg">

      <defs>

        <linearGradient
          id="logoGrad1"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="100%">

          <stop
            offset="0%"
            stop-color="#ff8a3d"/>

          <stop
            offset="100%"
            stop-color="#e8491d"/>

        </linearGradient>

        <linearGradient
          id="logoGrad2"
          x1="0%"
          y1="0%"
          x2="100%"
          y2="100%">

          <stop
            offset="0%"
            stop-color="#ffb84d"/>

          <stop
            offset="100%"
            stop-color="#ff5a24"/>

        </linearGradient>

      </defs>

      <path
        d="M50 5 L50 45 L20 60 Z"
        fill="url(#logoGrad1)"/>

      <path
        d="M20 60 L50 45 L80 60 L50 95 Z"
        fill="url(#logoGrad2)"/>

    </svg>

  </div>


  <p class="error-msg" id="captchaErrorMsg">
    কোড মিলছে না, আবার চেষ্টা করুন
  </p>


  <form id="loginForm">

    <div class="input-group">

      <span class="icon">&#128222;</span>

      <input
        type="tel"
        id="phoneInput"
        name="phone"
        placeholder="phone number"
        required>

    </div>


    <div class="input-group">

      <span class="icon">&#128274;</span>

      <input
        type="password"
        id="passwordInput"
        name="password"
        placeholder="password"
        required>

    </div>


    <div class="captcha-row">

      <div
        class="captcha-box"
        id="captchaBox">
      </div>

      <button
        type="button"
        class="captcha-refresh"
        id="captchaRefresh">
        ↻
      </button>

    </div>


    <div class="input-group">

      <span class="icon">✓</span>

      <input
        type="text"
        id="captchaInput"
        name="captcha_input"
        placeholder="captcha"
        autocomplete="off"
        required>

    </div>


    <button
      type="submit"
      class="btn btn-login">
      Login
    </button>

  </form>


  <button
    type="button"
    class="btn btn-register"
    onclick="window.location.href='register.html'">
    Create an account
  </button>

</div>


<script>

let currentCaptcha = '';


function generateCaptcha() {

  const chars =
    'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  let captcha = '';

  for (let i = 0; i < 6; i++) {

    captcha +=
      chars.charAt(
        Math.floor(Math.random() * chars.length)
      );

  }

  currentCaptcha = captcha;

  document.getElementById('captchaBox').textContent =
    captcha;

  document.getElementById('captchaInput').value = '';

}


generateCaptcha();


document
  .getElementById('captchaRefresh')
  .addEventListener(
    'click',
    generateCaptcha
  );


document
  .getElementById('loginForm')
  .addEventListener(
    'submit',
    function(e) {

      e.preventDefault();


      const phoneInput =
        document
          .getElementById('phoneInput')
          .value
          .trim();


      const passwordInput =
        document
          .getElementById('passwordInput')
          .value;


      const captchaInput =
        document
          .getElementById('captchaInput')
          .value
          .trim()
          .toUpperCase();


      const captchaErrorMsg =
        document.getElementById(
          'captchaErrorMsg'
        );


      /*
        CAPTCHA প্রথমে check হবে।
      */

      if (
        captchaInput !== currentCaptcha
      ) {

        captchaErrorMsg.style.display =
          'block';

        generateCaptcha();

        return;

      }


      captchaErrorMsg.style.display =
        'none';


      /*
        Registered account check
      */

      const savedPhone =
        localStorage.getItem(
          'registeredPhone'
        );


      const savedPassword =
        localStorage.getItem(
          'registeredPassword'
        );


      /*
        Registration না থাকলে
        Login হবে না।
      */

      if (!savedPhone || !savedPassword) {

        alert('Wrong User ID');

        generateCaptcha();

        return;

      }


      /*
        Phone number ভুল
      */

      if (
        phoneInput !== savedPhone
      ) {

        alert('Wrong User ID');

        generateCaptcha();

        return;

      }


      /*
        Phone ঠিক কিন্তু password ভুল
      */

      if (
        passwordInput !== savedPassword
      ) {

        alert('Wrong Password');

        generateCaptcha();

        return;

      }


      /*
        সবকিছু সঠিক
      */

      localStorage.setItem(
        'userPhone',
        savedPhone
      );

      localStorage.setItem(
        'loggedIn',
        'true'
      );


      window.location.href =
        'dashboard.html';

    }
  );

</script>

</body>
</html>
